/* Tue 26 Jan 2027, 6:00pm America/Los_Angeles. Computed once. */
function m3Epoch(){
  const tz='America/Los_Angeles', y=2027, mo=1, d=26, hh=18, mm=0;
  let t=Date.UTC(y, mo-1, d, hh+8, mm);
  const fmt=new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',hourCycle:'h23'});
  for(let n=0;n<6;n++){
    const p=fmt.formatToParts(new Date(t));
    const g0=(ty)=>Number(p.find(x=>x.type===ty).value);
    const delta=Date.UTC(y,mo-1,d,hh,mm)-Date.UTC(g0('year'),g0('month')-1,g0('day'),g0('hour'),g0('minute'));
    if(delta===0) break;
    t+=delta;
  }
  return t;
}
const M3=m3Epoch();

/* ---------- rng (setup and destination picks only, never per frame) ---------- */
let _s=1337;
function rnd(){_s=(_s*1664525+1013904223)&0x7fffffff;return _s/0x7fffffff;}
function ri(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(a){return a[Math.floor(rnd()*a.length)];}

/* ---------- images (decoded once, drawn at baked size) ---------- */

}

/* ---------- text ---------- */
function F(px,bold){g.font=(bold?'bold ':'')+px+'px "DejaVu Sans Mono",monospace';}
function T(s,x,y,px,col,align,bold){F(px,bold);g.fillStyle=col;g.textAlign=align||'left';g.textBaseline='alphabetic';g.fillText(s,x,y);g.textAlign='left';}
function TW(s,px,bold){F(px,bold);return g.measureText(s).width;}
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function frame(x,y,w,h,c){g.strokeStyle=c;g.lineWidth=1;g.strokeRect(x+.5,y+.5,w-1,h-1);}
const HEX={};
function hex(c,a){
  const k=c+a; const hit=HEX[k]; if(hit) return hit;
  const n=parseInt(c.slice(1),16);
  return HEX[k]='rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')';
}
const PAD=[]; for(let i=0;i<100;i++) PAD[i]=i<10?'0'+i:''+i;
function clip(s,n){s=String(s||''); return s.length>n?s.slice(0,n-1)+'…':s;}

const CHIP_POOL=[];
let chipN=0;
function place(x,y,w,h){
  for(let t=0;t<4;t++){
    let hit=false;
    for(let i=0;i<chipN;i++){
      const r=CHIP_POOL[i];
      if(x<r.x+r.w+2&&x+w+2>r.x&&y<r.y+r.h+2&&y+h+2>r.y){hit=true;break;}
    }
    if(!hit) break;
    y+=10;
  }
  const c=CHIP_POOL[chipN]||(CHIP_POOL[chipN]={x:0,y:0,w:0,h:0});
  c.x=x; c.y=y; c.w=w; c.h=h; chipN++;
  return y;
}
function chip(x,y,w,h,ac){rect(x,y,w,h,C.cream);frame(x,y,w,h,C.line2);rect(x,y,2,h,ac);}

/* ---------- metrics: null means the feed did not say. Never invent a number. ---------- */
const MET={
  submissions:null, perRole:null, users:null, raise:null, leadDay:null, leadWeek:null, usage:null, updated:'',
  vSub:'—', vRole:'—', vUsers:'—', vRaise:'—', vDay:'—', vWeek:'—', vUse:'—', vUpd:'no data'
};
let live=false;
let cdStr='—';
let clockStr='—';

let PAGE_TZ='';

function resetMetrics(){
  MET.submissions=MET.perRole=MET.users=MET.raise=MET.leadDay=MET.leadWeek=MET.usage=null;
  MET.updated='';
}
function asNum(v){
  if(typeof v==='number' && isFinite(v)) return v;
  if(typeof v==='string' && v.trim()!=='' && isFinite(Number(v))) return Number(v);
  return null;
}
function norm(s){return String(s||'').toLowerCase().replace(/&/g,' and ').replace(/[^a-z0-9]+/g,' ').trim();}
function readKey(obj, keys){
  if(!obj || typeof obj!=='object' || Array.isArray(obj)) return null;
  const ks=Object.keys(obj);
  for(let i=0;i<ks.length;i++){
    const nk=ks[i].toLowerCase().replace(/[^a-z0-9]/g,'');
    for(let j=0;j<keys.length;j++){
      if(nk!==keys[j]) continue;
      const v=obj[ks[i]];
      if(v && typeof v==='object'){
        const c=asNum(v.current); if(c!==null) return c;
      }
      return asNum(v);
    }
  }
  return null;
}
const K_SUB=['submissions','submissioncount','totalsubmissions'];
const K_ROLE=['submissionsperrole','perrole','rolecap','eachrole'];
const K_USERS=['users','totalusers','usercount'];
const K_RAISE=['raise','raise1','raised','raiseusd','capitalraised'];
const K_DAY=['leadday','leadtoday','leadbotday','chiefday','dailylead','leaddaily'];
const K_WEEK=['leadweek','leadweekly','leadbotweek','chiefweek','weeklylead'];
function pull(obj){
  if(!obj || typeof obj!=='object') return;
  const a=readKey(obj,K_SUB); if(a!==null) MET.submissions=a;
  const b=readKey(obj,K_ROLE); if(b!==null) MET.perRole=b;
  const c=readKey(obj,K_USERS); if(c!==null) MET.users=c;
  const d=readKey(obj,K_RAISE); if(d!==null) MET.raise=d;
  const e=readKey(obj,K_DAY); if(e!==null) MET.leadDay=e;
  const f=readKey(obj,K_WEEK); if(f!==null) MET.leadWeek=f;
  const u=readKey(obj,['weeklypct','usage']); if(u!==null && MET.usage===null) MET.usage=u;
}
function absorbGoal(g){
  if(!g || typeof g!=='object') return;
  const label=norm(g.label);
  const cur=asNum(g.current);
  const target=asNum(g.target);
  if(!label || cur===null) return;
  if(label.indexOf('submission')>=0){
    if(label.indexOf('role')>=0 || target===250){ if(MET.perRole===null) MET.perRole=cur; }
    else if(MET.submissions===null) MET.submissions=cur;
  } else if(label.indexOf('user')>=0){
    if(MET.users===null) MET.users=cur;
  } else if(label.indexOf('raise')>=0 || label.indexOf('capital')>=0){
    if(MET.raise===null) MET.raise = target===124 ? cur*1000 : cur;
  } else if(label.indexOf('lead')>=0 && (label.indexOf('day')>=0 || label.indexOf('today')>=0)){
    if(MET.leadDay===null) MET.leadDay=cur;
  } else if(label.indexOf('lead')>=0 && label.indexOf('week')>=0){
    if(MET.leadWeek===null) MET.leadWeek=cur;
  }
}
function fmtInt(n){return Math.round(n).toLocaleString('en-US');}
function fmtMoney(n){
  const sign=n<0?'-':'';
  return sign+'$'+Math.round(Math.abs(n)).toLocaleString('en-US');
}
function refreshViews(){
  MET.vSub = MET.submissions===null ? '—' : fmtInt(MET.submissions);
  MET.vRole = MET.perRole===null ? '—' : fmtInt(MET.perRole);
  MET.vUsers = MET.users===null ? '—' : fmtInt(MET.users);
  MET.vRaise = MET.raise===null ? '—' : fmtMoney(MET.raise);
  MET.vDay = MET.leadDay===null ? '—' : fmtInt(MET.leadDay);
  MET.vWeek = MET.leadWeek===null ? '—' : fmtInt(MET.leadWeek);
  MET.vUse = MET.usage===null ? '—' : (Math.round(MET.usage*10)/10)+'%';
  MET.vUpd = MET.updated ? MET.updated : 'no data';
}
function ratio(v, max){ if(v===null || !(max>0)) return -1; return v<=0?0:(v/max); }

 {k:'trump',   n:'BASELINE', full:'Analytics & Baselines', aliases:['analytics and baselines']},
 {k:'mini5',   n:'GATE',     full:'Platform & Gate S Monitor', aliases:['platform and gate s monitor']},

for(let i=7;i<13;i++) AGENTS[i].s='t';
const CHIEF_EXACT={'chief of bots':1,'chief':1,'coordination':1,'chief of bots coordination':1};
function isChief(name){
  const q=norm(name);
  return q ? CHIEF_EXACT[q]===1 : false;
}
function matchAgent(name){
  const q=norm(name); if(!q || isChief(q)) return null;
  for(let i=0;i<AGENTS.length;i++){
    const a=AGENTS[i];
    const keys=a._keys;
    for(let j=0;j<keys.length;j++) if(keys[j]===q) return a;
  }
  return null;
}
function mentions(text, full){
  const low=String(text||'').toLowerCase();
  const n=full.toLowerCase();
  if(n.length<4) return false;
  const i=low.indexOf(n);
  if(i<0) return false;
  const before=i===0?' ':low.charAt(i-1);
  const after=i+n.length>=low.length?' ':low.charAt(i+n.length);
  const edge=(c)=>!(c>='a'&&c<='z')&&!(c>='0'&&c<='9');
  return edge(before)&&edge(after);
}
function bounds(side){
  return side==='c'?{x0:214,x1:DIVX-28,y0:108,y1:348}:{x0:DIVX+28,x1:742,y0:108,y1:348};
}
let ci=0, ti=0;
AGENTS.forEach((a,i)=>{
  a._keys=[norm(a.full)].concat(a.aliases.map(norm));
  if(norm(a.n)===norm(a.full)) a._keys.push(norm(a.n));
  a._keys=a._keys.filter(Boolean);
  const ds=a.s==='c'?DESKS.filter(d=>d.side==='c'):DESKS.filter(d=>d.side==='t');
  const d=a.s==='c'?ds[ci++]:ds[ti++];
  a.x=d.seat.x; a.y=d.seat.y; a.tx=a.x; a.ty=a.y;
  a.state='work'; a.timer=1.2+rnd()*3.5; a.flip=false; a.leg=rnd()*6;
  a.sp=0.28+rnd()*0.16; a.at=d; a.id=i; a.taskText=''; a.prog=0; a.progOn=false;
  a._bt=null; a._bw=40; a.nw=0;
  a.line=a.full;
  d.by=i;
});
const ORDER=AGENTS.slice();
const ROSTER=[];
for(let i=0;i<AGENTS.length;i++) ROSTER.push(AGENTS[i]);
ROSTER.push({k:'grok', n:'CHIEF', s:'c', lead:true, state:'work'});
const GROK={x:480,y:348,bob:0,say:'',task:''};
let feed=[{t:'—', s:'c', w:'FEED', m:'no data'}];
const seen=new Set();
let TIME=0, tickerX=0;
const TICK=[];
let tickW=1;
var DEMO=true;

function sortOrder(){
  for(let i=1;i<ORDER.length;i++){
    const v=ORDER[i]; let j=i-1;
    while(j>=0 && ORDER[j].y>v.y){ ORDER[j+1]=ORDER[j]; j--; }
    ORDER[j+1]=v;
  }
}
function rebuildTicker(){
  TICK.length=0;
  F(7,true);
  if(!live || (feed.length===1 && feed[0].m==='no data')){
    const t='NO DATA';
    TICK.push({t:t, c:C.dim2, w:g.measureText(t).width+18});
  } else {
    for(let i=0;i<feed.length;i++){
      const e=feed[i];
      const t=(e.w?e.w+'  ':'')+e.m;
      const c=e.s==='t'?CAP_L:MKT_L;
      TICK.push({t:t, c:c, w:g.measureText(t).width+18});
    }
  }
  tickW=0; for(let i=0;i<TICK.length;i++) tickW+=TICK[i].w;
  if(tickW<1) tickW=1;
}
function measureStatic(){
  F(6,true);
  for(let i=0;i<DESKS.length;i++) DESKS[i].lw=g.measureText(DESKS[i].label).width+12;
  for(let i=0;i<AGENTS.length;i++) AGENTS[i].nw=g.measureText(AGENTS[i].n).width+10;
  for(let i=0;i<SPOTS_C.length;i++) SPOTS_C[i].lw=g.measureText(SPOTS_C[i].n).width+8;
  for(let i=0;i<SPOTS_T.length;i++) SPOTS_T[i].lw=g.measureText(SPOTS_T[i].n).width+8;
  rebuildTicker();
}
function bubbleW(a){
  if(a._bt===a.taskText) return a._bw;
  a._bt=a.taskText;
  F(6,true);
  a._bw=Math.max(28, g.measureText(a.taskText).width+12);
  return a._bw;
}
let sayCache='\0', sayW=40;
function sayWidth(){
  const s=GROK.say||'—';
  if(sayCache===s) return sayW;
  sayCache=s; F(7,true); sayW=g.measureText(s).width+14; return sayW;
}
function clockTick(nowMs){
  const sec=Math.floor(nowMs/1000);
  if(sec===lastSec) return;
  lastSec=sec;
  if(!clockFmt){
    const opt={hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'};
    try{ clockFmt=new Intl.DateTimeFormat('en-GB', PAGE_TZ?Object.assign({timeZone:PAGE_TZ},opt):opt); }
    catch(e){ clockFmt=new Intl.DateTimeFormat('en-GB', opt); }
  }
  clockStr=clockFmt.format(nowMs);
  let ms=M3-nowMs; if(ms<0) ms=0;
  const s=Math.floor(ms/1000);
  const dd=Math.floor(s/86400);
  const hh=Math.floor(s/3600)%24;
  const mm=Math.floor(s/60)%60;
  const ss=s%60;
  cdStr=(dd>99?String(dd):PAD[dd]||String(dd))+'d '+PAD[hh]+':'+PAD[mm]+':'+PAD[ss];
}

/* ---------- simulation: walk and idle only. No invented results. ---------- */
function release(a){
  if(a.at && a.at.by===a.id) a.at.by=undefined;
}
function step(dt){
  TIME+=dt;
  clockTick(Date.now());
  tickerX+=dt*18; if(tickerX>tickW) tickerX-=tickW;
  GROK.bob=Math.sin(TIME*2);
  for(let i=0;i<AGENTS.length;i++){
    const a=AGENTS[i];
    if(a.state==='work'){
      a.timer-=dt;
      if(a.timer<=0){
        release(a);
        const spots=a.s==='c'?SPOTS_C:SPOTS_T;
        const freeD=[]; const freeS=[];
        for(let k=0;k<DESKS.length;k++) if(DESKS[k].side===a.s && DESKS[k].by===undefined) freeD.push(DESKS[k]);
        for(let k=0;k<spots.length;k++) if(spots[k].by===undefined) freeS.push(spots[k]);
        let t;
        if((rnd()<0.28 && freeS.length) || !freeD.length){
          const sp=freeS.length?pick(freeS):pick(spots); sp.by=a.id;
          t={seat:{x:sp.x,y:sp.y}, ref:sp};
        } else {
          const d2=pick(freeD); d2.by=a.id; t=d2;
        }
        a.at=t.ref||t;
        a.tx=t.seat.x+(rnd()-0.5)*10;
        a.ty=t.seat.y+(rnd()-0.5)*6;
        a.state='walk';
      }
    } else {
      const dx=a.tx-a.x, dy=a.ty-a.y;
      if(Math.abs(dx)<1.2 && Math.abs(dy)<1.2){
        a.x=a.tx; a.y=a.ty; a.state='work'; a.timer=2.8+rnd()*4.2;
      } else {
        let mx=0, my=0;
        if(Math.abs(dx)>1) mx=Math.sign(dx)*a.sp*dt*60;
        else my=Math.sign(dy)*a.sp*dt*60;
        a.x+=mx; a.y+=my;
        const b=bounds(a.s);
        if(a.x<b.x0) a.x=b.x0; else if(a.x>b.x1) a.x=b.x1;
        if(a.y<b.y0) a.y=b.y0; else if(a.y>b.y1) a.y=b.y1;
        if(mx!==0) a.flip=mx<0;
        a.leg+=dt*10;
      }
    }
  }
}

/* ---------- drawing ---------- */
function drawDesk(d){
  const ac=d.side==='c'?MKT:CAP, acL=d.side==='c'?MKT_L:CAP_L;
  rect(d.x+2,d.y+d.h,d.w,3,'rgba(120,92,50,0.30)');
  rect(d.x,d.y,d.w,d.h,C.wood);
  rect(d.x,d.y,d.w,3,C.woodT);
  rect(d.x,d.y+d.h-2,d.w,2,C.woodD);
  for(let i=0;i<2;i++){
    const mx=d.x+6+i*26, my=d.y-12;
    rect(mx,my,18,12,C.deep); frame(mx,my,18,12,C.dline);
    const t=Math.floor(TIME*4)+i*3;

          const task=tasks[k]; if(!task || !task.text || task.state==='done') continue;
          const who=task.owner||'';
          if(isChief(who)){ if(!say) say=task.text; continue; }
          assignTask(matchAgent(who), task.text, task.progress);
        }
        const act=tm.activity||[];
        let took=0;
        for(let ai=0;ai<act.length && took<2 && feed.length<12;ai++){
          const a=act[ai]; if(!a || !a.text) continue;
          addFeed(side, clip(tm.name||'TEAM', 12), a.text, a.time||'—', false);
          took++;
          for(let p=0;p<AGENTS.length;p++){
            if(AGENTS[p].taskText) continue;
            if(mentions(a.text, AGENTS[p].full)) assignTask(AGENTS[p], a.text, null);
          }
        }
        const members=[];
        if(lead.name) members.push(lead);
        const ms=tm.members||[];
        for(let mi=0;mi<ms.length;mi++) members.push(ms[mi]);
        for(let mi=0;mi<members.length;mi++){
          const m=members[mi]; if(!m) continue;
          const line=m.working||m.work||m.task||'';
          if(!line) continue;
          if(isChief(m.name)||isChief(m.role)){ if(!say) say=line; }
          else assignTask(matchAgent(m.name)||matchAgent(m.role), line, m.progress);
        }
      }
      setSay(say);
      if(!feed.length) feed.push({t:'—', s:'c', w:'FEED', m:'no data'});
      refreshViews();
      live=true; DEMO=false;
    }
    if(d.stats && typeof d.stats==='object') pull(d.stats);
    if(Array.isArray(d.events)){
      for(let i=0;i<d.events.length;i++){
        const e=d.events[i];
        const id=e && e.id!==undefined ? String(e.id) : '';
        if(id){ if(seen.has(id)) continue; seen.add(id); }
        if(e) OFFICE.event(e);
      }
    }
    if(!cc && typeof d.say==='string' && d.say.trim()){ setSay(d.say); live=true; DEMO=false; }
    if(d.stats || (d.events && d.events.length)) { refreshViews(); live=true; DEMO=false; }
    rebuildTicker();
  }
};
window.OFFICE=OFFICE;
measureStatic();
refreshViews();
rebuildTicker();

window.addEventListener('message', function(e){
  const d=e.data;
  if(!d || typeof d!=='object') return;
  if(d.type==='cc-zone') OFFICE.zone(d.zone||'');
  else if(d.type==='cc-data') OFFICE.applyData(d.data||{});
});

(function(){
  const q=new URLSearchParams(location.search);
  const url=q.get('feed'); if(!url) return;
  const tick=async()=>{
    try{
      const r=await fetch(url+(url.indexOf('?')>=0?'&':'?')+'t='+Date.now(),{cache:'no-store'});
      if(!r.ok) return;
      const d=await r.json();
      OFFICE.applyData(d);
    }catch(err){}
  };
  tick();
  setInterval(tick, parseInt(q.get('poll')||'60000',10));
})();

let last=performance.now();
let running=true;
const FRAME=1000/30;
let acc=0;
function loop(now){
  if(document.hidden){ running=false; return; }
  let ms=now-last; last=now;
  if(ms>250) ms=250;
  acc+=ms;
  if(acc>=FRAME){
    const dt=acc/1000; acc=0;
    step(dt>0.05?0.05:dt);
    draw();
  }
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', function(){
  if(!document.hidden && !running){
    running=true; last=performance.now(); acc=0;
    requestAnimationFrame(loop);
  }
});
window.__frame=function(dt){ step(dt); draw(); return true; };
window.__ready=function(){
  const ks=Object.keys(IMG);
  for(let i=0;i<ks.length;i++){ const o=IMG[ks[i]]; if(!o.body.complete || !o.head.complete) return false; }
  return true;
};
draw();
if(location.search.indexOf('capture')<0) requestAnimationFrame(loop);
</script></body></html>
